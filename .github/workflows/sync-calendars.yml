# Hourly Airbnb calendar sync for the free single-service Render deploy
# (Render's free plan has no Cron Jobs).
#
# Setup — GitHub repository → Settings → Secrets and variables → Actions:
#   SITE_URL     your site, e.g. https://jerusalem-apartments.onrender.com
#   CRON_SECRET  the same value as CRON_SECRET on Render
#
# Without these secrets the workflow does nothing. You can also run it by hand
# from the Actions tab ("Run workflow").

name: Sync Airbnb calendars

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC)
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger calendar sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          # A sleeping free instance needs up to a minute to start: retry generously.
          curl --fail-with-body --silent --show-error \
               --retry 5 --retry-delay 20 --retry-all-errors --max-time 240 \
               -X POST "${SITE_URL%/}/api/cron/sync-calendars" \
               -H "X-Cron-Secret: $CRON_SECRET"
