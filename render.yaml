# FREE Render Blueprint — everything in ONE web service.
#
#   jerusalem-apartments     Docker web service (free): Next.js website + FastAPI API
#   jerusalem-apartments-db  PostgreSQL (free)
#
# Render → New → Blueprint → pick this repository. Values marked `sync: false`
# are typed in the Render dashboard and never stored in Git.
#
# Free-plan limits to know about:
#   * The service sleeps after ~15 minutes without traffic; the first visit
#     afterwards takes about a minute to wake it up.
#   * Free PostgreSQL databases expire 30 days after creation — upgrade the
#     database plan (or back it up) before then to keep your data.
#   * Render has no free Cron Jobs: the hourly Airbnb sync is triggered by the
#     GitHub Actions workflow in .github/workflows/sync-calendars.yml instead.
#   * The disk is wiped on every deploy: configure Cloudinary for photos.
#
# The paid multi-service setup is in render.paid.yaml.

databases:
  - name: jerusalem-apartments-db
    databaseName: jerusalem_apartments
    user: jerusalem_apartments
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []            # no public access; the service connects privately

services:
  - type: web
    name: jerusalem-apartments
    runtime: docker
    plan: free
    region: frankfurt          # closest Render region to Israel; must match the database
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # start.sh runs migrations, creates the first admin, then starts the API and the website.
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jerusalem-apartments-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true    # Render generates a strong random value once
      # First admin, created automatically on startup if no admin exists yet.
      # You can delete ADMIN_PASSWORD after your first login.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD    # at least 10 characters
        sync: false
      # Secret for the hourly sync call from GitHub Actions. Put the SAME value in
      # the GitHub repository secret CRON_SECRET. Any long random string.
      - key: CRON_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHATSAPP_NUMBER   # e.g. 972501234567 (editable later in Settings)
        sync: false
      # "true" adds 3 demo apartments on startup, only while the database has no
      # apartments. Delete them from the admin whenever you like.
      - key: SEED_DEMO_DATA
        value: "false"
