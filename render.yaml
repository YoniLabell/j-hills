# Paid single-instance SQLite deployment: Next.js + FastAPI + persistent disk.
# Review Render's existing service before applying this blueprint. Do not
# connect an existing PostgreSQL service without updating its DATABASE_URL.
services:
  - type: web
    name: jholiday
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/apartments.db
      - key: SECRET_KEY
        sync: false          # Preserve existing admin sessions; supply a strong secret
      # First admin, created automatically on startup if no admin exists yet.
      # You can delete ADMIN_PASSWORD after your first login.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD    # at least 10 characters
        sync: false
      # Secret for the hourly sync call from GitHub Actions. Put the SAME value in
      # the GitHub repository secret CRON_SECRET. Any long random string.
      - key: CRON_SECRET
        sync: false
      - key: GOOGLE_FORMS_SECRET
        sync: false
      - key: LOCAL_UPLOAD_DIR
        value: /var/data/uploads
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHATSAPP_NUMBER   # e.g. 972501234567 (editable later in Settings)
        sync: false
      # "true" adds 3 demo apartments on startup, only while the database has no
      # apartments. Delete them from the admin whenever you like.
      - key: SEED_DEMO_DATA
        value: "false"

